sudo: false
language: node_js
node_js:
  - 0.12
env:
  global:
    - SAUCE_USERNAME=faceleg
    - SAUCE_ACCESS_KEY=48ac5f65-440c-4684-9b5c-1761be1ff3a4
    - LOGS_DIR=/tmp/ngdialog/logs
    - BROWSER_PROVIDER_READY_FILE=/tmp/sauce-connect-ready
before_script:
  - npm install
  - npm install -g bower
  - bower install
  - mkdir -p $LOGS_DIR
  - ./scripts/sauce-connect.sh
  - ./scripts/wait-for-browser-ready.sh
script:
  - npm test
  - npm run serve &
  - sleep 3 # give Web server some time to bind to sockets, etc
  - npm run protractor
after_script:
  - ./scripts/print_logs.sh
